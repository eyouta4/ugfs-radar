# ============================================================
# CRITÈRES DE DISQUALIFICATION IMMÉDIATE
# ============================================================
disqualification_rules:
  - rule: "Article de presse, annonce institutionnelle, communiqué de presse — ce n'est PAS un appel ouvert"
    field: "type"
    examples:
      - "EU boosts clean energy in Tunisia with €35.8 million grant → article EIB, pas un appel"
      - "GCF welcomes new Accredited Entities → annonce GCF, pas un appel"
      - "Ivory Coast designated as headquarters → news, pas un appel"
      - "Fonds vert pour le climat: un portefeuille de 20 milliards → article FinDev, pas un appel"
  - rule: "Événement, webinaire, dialogue, conférence — sans possibilité de candidature"
    field: "type"
    examples:
      - "GCF Regional Dialogue with MENA → événement, pas un appel à proposals"
      - "How blended finance can unlock bankable green projects → webinaire ESI-Africa"
  - rule: "Page générique d'un site (homepage, page catégorie, annuaire, page pays)"
    field: "type"
    examples:
      - "Green Climate Fund: Homepage → page d'accueil greenclimate.fund"
      - "Country – Adaptation Fund /country/RG/ → page pays, pas un appel"
      - "Climate Fund Managers | Green Economy → annuaire wearevuka.com"
  - rule: "Géographie strictement hors scope (Asie hors MENA, Amérique du Nord, Amérique Latine sans éligibilité Afrique)"
    field: "geography"
    examples:
      - "ESTDEV — Botswana/Kenya/Namibie/Zambie/Tanzanie/Ouganda uniquement, pas Tunisie/Maghreb"
      - "Visa Grant Program YSpace — Canada uniquement"
  - rule: "Éligibilité réservée exclusivement aux ONG, groupes communautaires, jeunes ou individus"
    field: "eligibility"
    examples:
      - "YCJF — groupes émergents dirigés par des jeunes, ancrage local communautaire"
      - "MADICA — programme pour startups early-stage uniquement, pas pour fund managers"
      - "Honnold Foundation — ONG solaire communautaire uniquement"
  - rule: "RFP pour cabinet de conseil individuel ou expert individuel (pas pour gestionnaire de fonds)"
    field: "type"
    examples:
      - "Smart Africa RFP — recrutement consultant individuel"
  - rule: "Deadline clairement dépassée (plus de 7 jours avant la date du jour)"
    field: "deadline"
  - rule: "Programme réservé à des startups early-stage — SAUF si UGFS peut y entrer comme incubateur/accélérateur via Wikistartup"
    field: "eligibility"
    examples:
      - "Renew Venture Lab — fondateurs startups seulement"
      - "Comcast Innovation Fund — open-source uniquement"
  - rule: "Annonce de résultats (semi-finalists, laureats, award winners) → appel DÉJÀ FERMÉ"
    field: "type"
    examples:
      - "Semi-Finalists Announced: A4FM First Call → appel A4FM déjà fermé"

