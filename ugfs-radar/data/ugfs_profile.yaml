# ============================================================
# CRITÈRES DE DISQUALIFICATION IMMÉDIATE
# ============================================================
disqualification_rules:
  - rule: "Géographie strictement hors scope (Asie hors MENA, Amérique du Nord, Amérique Latine)"
    field: "geography"
    examples:
      - "ESTDEV — financement uniquement Botswana/Kenya/Namibie/Zambie/Tanzanie/Ouganda → UGFS non éligible (géo trop restrictive, pas Tunisie/Maghreb)"
      - "Visa Grant Program YSpace — Canada uniquement"
  - rule: "Éligibilité réservée exclusivement aux ONG, groupes locaux, jeunes ou individus"
    field: "eligibility"
    examples:
      - "YCJF — exige groupes émergents dirigés par des jeunes, ancrage local communautaire"
      - "Sustainability Open Innovation Challenge — non éligible pour fonds"
      - "MADICA — programme startups, pas pour fund managers"
      - "Honnold Foundation — ONG solaire communautaire uniquement"
  - rule: "RFP/TDR pour cabinet de conseil individuel (pas pour gestionnaire de fonds)"
    field: "type"
    examples:
      - "Smart Africa RFP — recrutement cabinet conseil, pas pour fonds"
  - rule: "Deadline clairement dépassée"
    field: "deadline"
  - rule: "Programme réservé à des startups en early stage (pas à des gestionnaires de fonds)"
    field: "eligibility"
    examples:
      - "Renew Venture Lab — accompagnement fondateurs de startups africains"
      - "Comcast Innovation Fund — projets open-source / connectivité"

# ============================================================
# SIGNAUX DE GO IDENTIFIÉS DANS L'HISTORIQUE UGFS
# ============================================================
# Ces patterns correspondent aux AOs sur lesquels UGFS a soumis (GO_SUBMITTED)
# → L'agent doit reconnaître ces types d'opportunités en priorité
go_patterns:
  - "Appel à manifestation d'intérêt pour gestionnaire de fonds climatique en Afrique"
  - "Call for fund managers to deploy blended finance for climate in Africa/MENA"
  - "Grant or mandate for emerging fund manager in climate / green / blue economy"
  - "Acceleration ou incubation pour fonds à impact (pas pour startups individuelles)"
  - "Co-gestion ou délégation d'un fonds d'investissement vert / eau / agri en Afrique"
  - "Programme financement institution (GCF, AFD, AfDB, GIZ) pour fonds africain"
  - "Call for proposals for financial intermediaries / asset managers in Africa"
  - "RFP pour fonds d'investissement à impact / blended finance Afrique MENA"

# ============================================================
# PONDÉRATION DU SCORING (somme = 100)
# ============================================================
# Ces poids sont initiaux — ajustés automatiquement par la boucle d'apprentissage
scoring_weights:
  geography_match:       20   # géo primaire/secondaire/Europe
  theme_match:           20   # green/blue/generaliste vs thèmes UGFS
  vehicle_match:         25   # match avec un véhicule actif UGFS → très important
  partner_match:         10   # partenaire prioritaire mentionné
  deadline_feasibility:  10   # deadline réaliste pour soumission (>= 14j restants)
  ticket_in_sweet_spot:   5   # montant dans la sweet spot UGFS
  language_match:         5   # langue fr/en préférée
  similarity_to_past_go:  5   # similarité sémantique avec AOs soumis passés

# ============================================================
# BOUCLE D'APPRENTISSAGE
# ============================================================
learning:
  min_feedbacks_for_recalibration: 5
  method: logistic_regression
  cadence: weekly
  feedback_email: "radar-feedback@ugfs-na.com"
  # Après chaque réunion UGFS : renvoyer le fichier Excel avec colonne J remplie
  # L'agent intègre les décisions et recalibre ses poids de scoring automatiquement
