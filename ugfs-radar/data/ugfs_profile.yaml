# ============================================================
# UGFS NORTH AFRICA — Profil d'investissement structuré
# VERSION 3 — enrichi avec données réelles + discussion Teams + Excel AOs 2026
# ============================================================
#
# Ce fichier est la SOURCE DE VÉRITÉ pour le scoring LLM.
# Données extraites de :
#   - Tableau historique AOs UGFS 2024-2026 (Excel)
#   - Discussion Teams interne UGFS (mars-avril 2026)
#   - Document "Développement AI AO et funding"
#   - Soumissions réelles (GO_SUBMITTED) identifiées
# ============================================================

organization:
  name: "UGFS North Africa"
  hq: "Tunis, Tunisie"
  type: "Private Equity / Asset Management / Blended Finance"
  tagline: >
    UGFS est un gestionnaire de fonds d'impact basé à Tunis, spécialisé
    en finance climatique, blue economy, agritech et transition énergétique.
    Il répond aux appels d'offres en tant que gestionnaire de fonds (fund manager),
    co-développeur de projets énergétiques, ou prestataire d'advisory/TA.
    Son activité principale : lever des capitaux privés pour des véhicules
    thématiques (TGF, Blue Bond, Seed of Change, NEW ERA, Musanada).
    UGFS travaille en partenariat avec Wikistartup (incubation/startups).

# === Types d'opportunités acceptées ===
opportunity_types:
  - asset_management   # UGFS gère / co-gère un fonds → priorité absolue
  - grants             # Subventions pour développement de véhicule ou projet pilote
  - advisory           # Mandats de conseil en stratégie climatique / blended finance
  - mandates           # Mandat de gestion délégué par une institution
  - technical_assistance  # TA / assistance technique pour portefeuille vert

# === Thématiques avec pondération (somme = 100) ===
themes:
  green:       50   # Énergie, climat, CO2, renouvelable, solaire — pilier TGF
  blue:        30   # Eau, océan, marine, blue economy — pilier Blue Bond
  generaliste: 20   # Agritech, digital, infrastructure, social, incubation

# === Géographies cibles ===
geographies:
  primary:                              # Forte probabilité GO — boost scoring
    - Tunisia
    - Tunisie
    - Maghreb
    - Afrique du Nord / North Africa
    - MENA
    - Afrique / Africa (général)
    - Sénégal / Senegal                 # FEVE fund soumis 03/04/2026
    - Tanzanie / Tanzania               # AECF TA missions soumis
  secondary:                            # Intérêt — traiter sérieusement
    - Afrique sub-saharienne / Sub-Saharan Africa
    - Afrique de l'Ouest / West Africa
    - Afrique de l'Est / East Africa
    - Maroc / Morocco
    - Algérie / Algeria
    - Egypte / Egypt
    - Kenya
    - Ethiopie / Ethiopia
    - Rwanda
    - Sierra Leone                      # SOGREA mini-grids UE
    - Nigeria
    - Ghana
  europe:                               # Synergie co-investissement — potentiel
    - European Union / EU
    - France
    - Belgium
    - Netherlands / Pays-Bas
    - Germany / Allemagne
    - Denmark / Danemark
    - Finland / Finlande
    - Luxembourg
    - Switzerland / Suisse
  excluded_strict:                      # Score 0 si GÉO UNIQUE hors scope
    - North America (sauf si éligibilité Afrique explicite)
    - Latin America
    - East Asia / Pacific (sauf si éligibilité globale / Afrique)
    - Canada only
    - USA only

# === Ticket size ===
ticket_size:
  no_restriction: true
  sweet_spot_min_usd: 100_000           # même les petits grants (CIEIF, YCJF) sont analysés
  sweet_spot_max_usd: 50_000_000
  notes: >
    UGFS répond à des appels de 100K USD (Climate KIC, CIEIF) comme à des
    projets de plusieurs millions (SIFI, APIA/GCF, Kébili PV+BESS 300MW).

# === Langues de soumission ===
languages:
  preferred: [fr, en]
  acceptable: [ar]
  excluded: []

