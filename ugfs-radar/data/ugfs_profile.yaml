# ============================================================
# UGFS NORTH AFRICA — Profil d'investissement structuré
# VERSION 2 — enrichi avec données historiques réelles (2024-2026)
# ============================================================
#
# Ce fichier est la SOURCE DE VÉRITÉ pour le scoring.
# Les signaux ci-dessous sont dérivés de :
#   - Tableau historique des AOs traités par UGFS (2024-2026)
#   - Discussions Teams internes UGFS sur les appels d'offres
#   - Prospections 2024 UGFS
# ============================================================

organization:
  name: "UGFS North Africa"
  hq: "Tunis, Tunisie"
  type: "Private Equity / Asset Management / Blended Finance"
  tagline: >
    UGFS est un gestionnaire de fonds d'impact basé à Tunis, spécialisé
    en finance climatique, blue economy et agritech. Il répond aux appels
    d'offres en tant que gestionnaire de fonds (fund manager), pas comme ONG.
    Son activité principale : lever des capitaux privés pour des véhicules
    thématiques (TGF, Blue Bond, Seed of Change, NEW ERA, Musanada).

# === Types d'opportunités acceptées ===
opportunity_types:
  - asset_management   # UGFS gère / co-gère un fonds → priorité absolue
  - grants             # Subventions pour développement de véhicule ou projet pilote
  - advisory           # Mandats de conseil en stratégie climatique / blended finance
  - mandates           # Mandat de gestion délégué par une institution (AfDB, GCF…)

# === Thématiques avec pondération (somme = 100) ===
themes:
  green:       50   # Énergie, climat, CO2, renouvelable — pilier TGF
  blue:        30   # Eau, océan, marine, blue economy — pilier Blue Bond
  generaliste: 20   # Agritech, digital, infrastructure, social

# === Géographies cibles ===
# EXPANSION STRATÉGIQUE : Afrique + Europe (synergies co-investissement)
geographies:
  primary:                              # Forte probabilité GO — boost scoring
    - Tunisia
    - Tunisie
    - Maghreb
    - Afrique du Nord / North Africa
    - MENA
    - Afrique / Africa (général)
  secondary:                            # Intérêt — traiter sérieusement
    - Afrique sub-saharienne / Sub-Saharan Africa
    - Afrique de l'Ouest / West Africa
    - Sénégal
    - Mauritanie / Mauritania
    - Maroc / Morocco
    - Algérie / Algeria
    - Egypte / Egypt
    - Kenya
    - Ethiopie / Ethiopia
    - Rwanda
    - Afrique de l'Est / East Africa
  europe:                               # Synergie co-investissement — potentiel
    - European Union / EU
    - France
    - Belgium
    - Netherlands
    - Germany
    - Denmark
    - Finland
    - Luxembourg
    - Switzerland
  excluded_strict:                      # Score 0 si GÉO UNIQUE hors scope
    - North America (sauf si éligibilité Afrique explicite)
    - Latin America
    - East Asia / Pacific (sauf si éligibilité globale / Afrique)

# === Ticket size ===
ticket_size:
  no_restriction: true
  sweet_spot_min_usd: 500_000
  sweet_spot_max_usd: 50_000_000

# === Langues de soumission ===
languages:
  preferred: [fr, en]
  acceptable: [ar]
  excluded: []

