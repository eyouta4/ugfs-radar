# ============================================================
# CRITÈRES DE DISQUALIFICATION IMMÉDIATE
# ============================================================
disqualification_rules:
  - rule: "Géographie strictement hors scope (Asie hors MENA, Amérique du Nord, Amérique Latine sans éligibilité Afrique)"
    field: "geography"
    examples:
      - "ESTDEV — Botswana/Kenya/Namibie/Zambie/Tanzanie/Ouganda uniquement, pas Tunisie/Maghreb"
      - "Visa Grant Program YSpace — Canada uniquement"
  - rule: "Éligibilité réservée exclusivement aux ONG, groupes communautaires, jeunes ou individus"
    field: "eligibility"
    examples:
      - "YCJF — groupes émergents dirigés par des jeunes, ancrage local communautaire"
      - "MADICA — programme pour startups early-stage uniquement, pas pour fund managers"
      - "Honnold Foundation — ONG solaire communautaire uniquement"
  - rule: "RFP pour cabinet de conseil individuel ou expert individuel (pas pour gestionnaire de fonds)"
    field: "type"
    examples:
      - "Smart Africa RFP — recrutement consultant individuel"
  - rule: "Deadline clairement dépassée (plus de 7 jours avant la date du jour)"
    field: "deadline"
  - rule: "Programme réservé à des startups early-stage — SAUF si UGFS peut y entrer comme incubateur/accélérateur via Wikistartup"
    field: "eligibility"
    examples:
      - "Renew Venture Lab — fondateurs startups seulement"
      - "Comcast Innovation Fund — open-source uniquement"

# ============================================================
# SIGNAUX DE GO — PATTERNS HISTORIQUES UGFS (RÉELS)
# ============================================================
# Sources : Excel "Tableau de synthèse" + discussion Teams UGFS mars-avril 2026
# Ces patterns correspondent aux AOs sur lesquels UGFS a soumis ou est en cours
go_patterns:
  # Types d'opportunités prouvés (soumissions réelles)
  - "Call for fund managers to deploy blended finance for climate in Africa/MENA (→ TGF)"
  - "Grant ou mandate pour emerging fund manager en climate / green / blue economy (→ TGF/NEW ERA)"
  - "Accélérateur ou incubateur pour fonds à impact — pas pour startups individuelles (→ TGF)"
  - "Co-gestion ou délégation d'un fonds d'investissement vert / eau / agri en Afrique (→ TGF/Blue Bond/Seed)"
  - "Programme financement institution (GCF, AFD, AfDB, GIZ, Mitigation AF, Climate KIC) pour fonds africain"
  - "Call for proposals for financial intermediaries / asset managers in Africa"
  - "RFP pour fonds d'investissement à impact / blended finance Afrique MENA"
  - "Expression d'intérêt pour gestionnaire de fonds climatique — Afrique Subsaharienne ou MENA"
  # Nouvelles pistes Teams avril 2026
  - "Advisory ou Technical Assistance (TA) pour portefeuille d'entreprises vertes / clean energy en Afrique"
  - "Co-développement projets énergie solaire / mini-grids en Afrique (→ TGF comme arrangeur/investisseur)"
  - "Appel à projets energy productive use / off-grid solar / biomass Africa avec composante financement"
  - "Consortium Afrique-Europe pour innovation climatique / digitale (JIF, Horizon Europe) — avec partenaire EU"
  - "Programme préparation à l'investissement (project preparation) pour énergie propre en Afrique"
  - "Appel d'offres gouvernement tunisien ou africain pour développement énergie renouvelable (positionnement arrangeur)"
  # Sources web où UGFS a historiquement trouvé des AOs
  - "LinkedIn posts de: blended finance, Africa climate fund, development finance, impact investing Africa"
  - "Posts LinkedIn avec: Call for EOI, Call for Proposals, Fund Manager, Advisory Mandate + Africa/MENA"

